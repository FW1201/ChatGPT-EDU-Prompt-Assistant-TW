<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; font-synthesis: none; }
    body {
      width: 220px; padding: 18px; margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      transition: background 0.3s ease, color 0.3s ease;
    }
    body.light {
      --bg: #ffffff; --text: #111827; --muted: #4b5563;
      --button-bg: #111111; --button-text: #ffffff; --button-hover: #000000;
    }
    body.dark {
      --bg: #111111; --text: #f4f4f5; --muted: #a1a1aa;
      --button-bg: #f4f4f5; --button-text: #111111; --button-hover: #d4d4d8;
    }
    .title { font-size: 16px; font-weight: 600; margin-bottom: 16px; text-align: center; }
    .main-btn {
      width: 100%; padding: 12px; border-radius: 999px;
      border: 1px solid var(--button-bg); background: var(--button-bg);
      color: var(--button-text); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.2s ease, transform 0.2s ease;
    }
    .main-btn:hover { background: var(--button-hover); transform: translateY(-1px); }
    .note { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; }
    .lang-toggle {
      position: absolute; top: 8px; right: 8px; padding: 4px 8px;
      border-radius: 12px; border: 1px solid var(--muted);
      background: transparent; color: var(--muted);
      font-size: 11px; cursor: pointer;
    }
  </style>
</head>
<body class="light">
  <button class="lang-toggle" id="langToggle">EN</button>
  <div class="title" id="title">Prompt 助手</div>
  <button class="main-btn" id="toggleSidebar">開啟提示詞面板</button>
  <p class="note" id="note">已針對 ChatGPT 介面最佳化</p>
  <script src="popup.js"></script>
</body>
</html>
